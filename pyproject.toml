# Dev tooling for the Python helpers in scripts/. No runtime dependencies: every
# script is standard-library only and runs as `python3 -I scripts/<name>.py`.
[project]
name = "core-iac"
version = "0.1.0"
description = "Infrastructure as Code for automation-calculations.io, plus its Python helper scripts"
authors = [
    {name = "Steven Uray", email = "steven.uray@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "black (>=26.3.0,<27.0.0)",
    "ruff (>=0.16.10,<0.17.0)"
]

[tool.black]
target-version = ["py312"]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = [".", "scripts"]
testpaths = ["tests"]
