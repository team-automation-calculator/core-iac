# Default values for automation-calculator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
#
# Per-environment overrides live in values-<env>.yaml (image.tag, shortCommitHash,
# ingress.host, ingress.albName, secrets.create: false). The ArgoCD Application
# injects ingress.certificateArn (from Terraform's ACM output); Terraform manages the app Secret itself
# (ArgoCD migration Phase 4); the secrets.* defaults below exist for standalone
# renders of the chart, such as the Phase 3 canary, and are unusable on purpose.

affinity: {}
fullnameOverride: automation-calculator
googleAnalyticsTrackingID: "G-1E2HD2B2RH"
image:
  pullPolicy: Always
  repository: automationcalculationsci/automation-calculator
  tag: 0.9.6-1098
ingress:
  # ALB name. Must never change for a live environment: the ALB controller replaces the ALB.
  albName: automation-calculator-alb
  # ACM certificate ARN for the host and its www. alias. Required when ingress.enabled.
  certificateArn: ""
  enabled: true
  host: "development.automation-calculations.io"
# Probes hit /health, which runs SELECT 1 against the DB. A cold pod (first DB
# connection, db:create/db:migrate in the entrypoint) can take several seconds to
# answer, so each probe allows 5s per attempt and the startupProbe gives the pod up
# to 3 minutes to boot before liveness can restart it.
livenessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
logToStdout: true
nameOverride: ""
podAnnotations: {}
# Rendered only when replicaCount is above 1: with a single replica,
# minAvailable 1 would block every node drain until the node group update
# times out.
podDisruptionBudget:
  enabled: true
  minAvailable: 1
podSecurityContext: {}
# Seconds a terminating pod keeps serving before it gets SIGTERM. On a node
# roll the replacement pod is on a new node, which the ALB only starts using
# after 2 health checks 15s apart (instance targets), so the old pod has to
# outlive that window. 0 disables the hook.
preStopSleepSeconds: 40
railsEnv: production
readinessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
# Two replicas plus the PodDisruptionBudget are what keep the app serving while
# a node is drained (AMI release, EKS upgrade): one pod is evicted, starts on
# the new node and turns Ready before the other may be evicted. The app's rate
# limiter counts per pod, so every limit is effectively doubled at 2
# (plans/rate-limit-shared-cache-store.md).
replicaCount: 2
resources:
  limits:
    cpu: 750m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi
secrets:
  # Render the Secret from the chart. Every value below is required when true;
  # `helm template` with these empty defaults fails on purpose (helm lint does not).
  # The default stays true so a standalone render (the Phase 3 canary, a local
  # `helm template` with placeholders) is self-contained; every values-<env>.yaml
  # sets it to false because Terraform owns the real Secret since Phase 4.
  create: true
  databaseUrl: ""
  githubOAuthAppId: ""
  githubOAuthAppSecret: ""
  googleOAuthAppId: ""
  googleOAuthAppSecret: ""
  kubernetesSecretObjectName: automation-calculator-app-secrets
  secretKeyBase: ""
securityContext: {}
shortCommitHash: "3b95755"
service:
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: http
  # Cluster, not Local. With Local a node passes the ALB health check only
  # while an app pod runs on it, so on a node roll the replacement nodes stay
  # unhealthy until a pod lands on them, while the old node has already left
  # the target group: staging went dark for two minutes on 2026-11-25 with
  # two replicas and the PodDisruptionBudget in place. With Cluster every
  # node forwards to a ready pod wherever it runs. The client address still
  # reaches the app in the ALB's X-Forwarded-For header.
  externalTrafficPolicy: Cluster
  port: 80
  targetPort: 3000
  type: NodePort
startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 36
# Must exceed preStopSleepSeconds by the time Puma needs to finish in-flight
# requests after SIGTERM.
terminationGracePeriodSeconds: 70
tolerations: []
