# Default values for automation-calculator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
#
# Per-environment overrides live in values-<env>.yaml (image.tag, shortCommitHash,
# ingress.host, ingress.albName, secrets.create: false). Terraform injects
# ingress.certificateArn at release time and manages the app Secret itself
# (ArgoCD migration Phase 4); the secrets.* defaults below exist for standalone
# renders of the chart, such as the Phase 3 canary, and are unusable on purpose.

affinity: {}
fullnameOverride: automation-calculator
googleAnalyticsTrackingID: "G-1E2HD2B2RH"
image:
  pullPolicy: Always
  repository: automationcalculationsci/automation-calculator
  tag: 0.9.6-970
ingress:
  # ALB name. Must never change for a live environment: the ALB controller replaces the ALB.
  albName: automation-calculator-alb
  # ACM certificate ARN for the host and its www. alias. Required when ingress.enabled.
  certificateArn: ""
  enabled: true
  host: "development.automation-calculations.io"
# Probes hit /health, which runs SELECT 1 against the DB. A cold pod (first DB
# connection, db:create/db:migrate in the entrypoint) can take several seconds to
# answer, so each probe allows 5s per attempt and the startupProbe gives the pod up
# to 3 minutes to boot before liveness can restart it.
livenessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
logToStdout: true
nameOverride: ""
podAnnotations: {}
podSecurityContext: {}
railsEnv: production
readinessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
replicaCount: 1
resources:
  limits:
    cpu: 750m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi
secrets:
  # Render the Secret from the chart. Every value below is required when true;
  # `helm template` with these empty defaults fails on purpose (helm lint does not).
  # The default stays true so a standalone render (the Phase 3 canary, a local
  # `helm template` with placeholders) is self-contained; every values-<env>.yaml
  # sets it to false because Terraform owns the real Secret since Phase 4.
  create: true
  databaseUrl: ""
  githubOAuthAppId: ""
  githubOAuthAppSecret: ""
  googleOAuthAppId: ""
  googleOAuthAppSecret: ""
  kubernetesSecretObjectName: automation-calculator-app-secrets
  secretKeyBase: ""
securityContext: {}
shortCommitHash: ""
service:
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: http
  externalTrafficPolicy: Local
  port: 80
  targetPort: 3000
  type: NodePort
startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 36
tolerations: []
