# Per-environment values for production. Layered on top of values.yaml.
# Source of truth for what is deployed: the bump scripts edit image.tag and
# shortCommitHash here; Terraform (and later ArgoCD) reads this file.
image:
  tag: 0.9.6-970
shortCommitHash: "2e659b6"
ingress:
  host: automation-calculations.io
  albName: ac-app-production
# The Secret automation-calculator-app-secrets is a Terraform resource
# (kubernetes_secret_v1 in terraform/modules/aws/main_rails_app) since ArgoCD
# migration Phase 4. The chart must not render one here: a chart-rendered
# Secret would fight Terraform for the object.
secrets:
  create: false
