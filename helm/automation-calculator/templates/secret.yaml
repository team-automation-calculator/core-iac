{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.kubernetesSecretObjectName }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "automation-calculator.labels" . | nindent 4 }}
type: Opaque
stringData:
  databaseUrl: {{ required "secrets.databaseUrl is required" .Values.secrets.databaseUrl }}
  githubOAuthAppId: {{ required "secrets.githubOAuthAppId is required" .Values.secrets.githubOAuthAppId }}
  githubOAuthAppSecret: {{ required "secrets.githubOAuthAppSecret is required" .Values.secrets.githubOAuthAppSecret }}
  googleOAuthAppId: {{ required "secrets.googleOAuthAppId is required" .Values.secrets.googleOAuthAppId }}
  googleOAuthAppSecret: {{ required "secrets.googleOAuthAppSecret is required" .Values.secrets.googleOAuthAppSecret }}
  secretKeyBase: {{ required "secrets.secretKeyBase is required" .Values.secrets.secretKeyBase }}
{{- end }}
