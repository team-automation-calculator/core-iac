apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "automation-calculator.fullname" . }}
  labels:
    {{- include "automation-calculator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Start the replacement before stopping a pod, so a deploy never drops below
  # replicaCount Ready pods.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "automation-calculator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "automation-calculator.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
          - name: APP_HOSTNAME
            value: {{ .Values.ingress.host }}
          - name: GOOGLE_ANALYTICS_TRACKING_ID
            value: {{ .Values.googleAnalyticsTrackingID }}
          - name: RAILS_ENV
            value: {{ .Values.railsEnv }}
          - name: RAILS_LOG_TO_STDOUT
            value: "{{ .Values.logToStdout }}"
          - name: RAILS_SERVE_STATIC_FILES
            value: "true"
          - name: SHORT_COMMIT_HASH
            value: "{{ .Values.shortCommitHash }}"
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: {{ .Values.secrets.kubernetesSecretObjectName }}
                key: databaseUrl
          - name: GITHUB_OAUTH_APP_ID
            valueFrom:
              secretKeyRef:
                name: {{ .Values.secrets.kubernetesSecretObjectName }}
                key: githubOAuthAppId
          - name: GITHUB_OAUTH_APP_SECRET
            valueFrom:
              secretKeyRef:
                name: {{ .Values.secrets.kubernetesSecretObjectName }}
                key: githubOAuthAppSecret
          - name: GOOGLE_OAUTH_APP_ID
            valueFrom:
              secretKeyRef:
                name: {{ .Values.secrets.kubernetesSecretObjectName }}
                key: googleOAuthAppId
          - name: GOOGLE_OAUTH_APP_SECRET
            valueFrom:
              secretKeyRef:
                name: {{ .Values.secrets.kubernetesSecretObjectName }}
                key: googleOAuthAppSecret
          - name: SECRET_KEY_BASE
            valueFrom:
              secretKeyRef:
                name: {{ .Values.secrets.kubernetesSecretObjectName }}
                key: secretKeyBase
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if gt (int .Values.preStopSleepSeconds) 0 }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ int .Values.preStopSleepSeconds }}
          {{- end }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
    {{- with .Values.nodeSelector }}
    nodeSelector:
      {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.affinity }}
    affinity:
      {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.tolerations }}
    tolerations:
      {{- toYaml . | nindent 8 }}
    {{- end }}
    