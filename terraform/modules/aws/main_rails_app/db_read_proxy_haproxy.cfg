# TCP relay from the pod's port 5432 to the RDS endpoint (db_read_only_access.tf).
# The name is resolved through the cluster DNS and re-resolved while running,
# so an instance whose address changes is followed without a restart.
global
    log stdout format raw local0 info
    maxconn 32

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 1h
    timeout server 1h

resolvers cluster
    parse-resolv-conf
    hold valid 10s

frontend postgres
    bind :5432
    default_backend rds

backend rds
    server rds ${db_host}:${db_port} resolvers cluster init-addr last,libc,none
